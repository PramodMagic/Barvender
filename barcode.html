<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real-Time Barcode – Label HUB</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
:root{--bg:#eef1ee;--panel:#fff;--ink:#14231c;--mute:#5d6b63;--line:#d5dcd6;--brand:#0f6b4f;--brand2:#e9f4ef}
*{box-sizing:border-box}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:4px;padding:0 16px;height:48px;background:#fff;border-bottom:1px solid var(--line)}
.top .logo{font:700 18px Georgia,serif;margin-right:auto;text-decoration:none;color:var(--ink)}
.top a.l{padding:6px 12px;border-radius:6px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px}
.top a.l:hover{background:var(--brand2)}.top a.on{background:var(--brand2);color:var(--brand)}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:360px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;overflow-y:auto;max-height:calc(100vh - 48px);position:sticky;top:48px}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mute);margin:0 0 12px;font-size:13px}
details{border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
summary{padding:9px 12px;font-weight:600;cursor:pointer;background:var(--brand2);border-radius:6px}
.body{padding:10px 12px}label{display:block;margin:6px 0 2px;font-size:12.5px;color:var(--mute)}
.chk{display:flex;align-items:center;gap:7px;color:var(--ink);cursor:pointer}
input[type=text],input[type=number],select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:5px;font:inherit;background:#fff}
#val{font-size:18px;padding:10px;border:2px solid var(--brand)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;padding:8px 12px;border-radius:6px;border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer;font-weight:600}
button.alt{background:#fff;color:var(--brand)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #e08a00;outline-offset:1px}
.rrow{display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
.rrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp{width:62px!important;padding:3px 4px!important}.rrow button{padding:2px 8px}
.q{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:5px;padding:2px 8px;margin-top:8px}
main{padding:18px;overflow:auto}.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px}.bar .info{flex:1;color:var(--mute)}
.paper{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18);margin:0 auto;width:fit-content}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:1mm;flex:none;font-family:Arial,sans-serif;color:#000;outline:1px dashed #bbb}
.num{font-weight:700;text-align:center;line-height:1.1;margin-top:.5mm;word-break:break-all}
.t{font-weight:700;text-align:center;line-height:1.15;margin-bottom:.5mm}
svg.bc{width:100%;flex:1;min-height:0}
.pg{break-after:page;page-break-after:always;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18);margin:0 auto 12px;overflow:hidden}
.pg:last-child{break-after:auto;page-break-after:auto}
.err{font:12px Arial;color:#b00;padding:4px;text-align:center}
.empty{padding:60px 20px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:10px;background:#fff}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;max-height:none}}
@media print{.top{display:none}html,body{height:auto}.app{min-height:0}main{overflow:visible}body{background:#fff}.app{display:block}aside,.bar,.empty{display:none}main{padding:0}
.paper{box-shadow:none;margin:0;width:auto!important;padding:0!important}.cell{outline:none}.pg{box-shadow:none;margin:0}}
</style><style id="pageStyle"></style></head><body>
<nav class="top"><a class="logo" href="/">Label HUB</a><a class="l" href="/">Home</a><a class="l" href="/app">Excel labels</a><a class="l on" href="/barcode">Real-time barcode</a></nav>
<div class="app"><aside>
<h1>Real-time Barcode</h1><p class="sub">Pick a paper, type or scan, and print.</p>

<details open><summary>1. Paper</summary><div class="body">
<label>Paper size</label>
<select id="paper"><option value="210,297">A4</option><option value="148,210">A5</option><option value="216,279">Letter</option><option value="101.6,152.4">4 × 6 in</option><option value="custom">Custom / roll</option></select>
<div class="row" id="cust" hidden><div><label>Width mm</label><input type="number" id="pw" value="104.8" step="0.1"></div><div><label>Height mm</label><input type="number" id="ph" value="38" step="0.1"></div></div>
<label>Layout</label>
<select id="mode"><option value="page">Per paper (roll / thermal): fills each paper with barcode boxes</option><option value="flow">Sheet: barcodes flow across the page</option></select>
<label class="chk" style="margin:8px 0 2px"><input type="checkbox" id="auto" checked> Auto layout: margin and boxes per paper are set automatically</label>
<div class="row"><div><label>Barcode box width mm</label><input type="number" id="cw" value="50"></div><div><label>Barcode box height mm</label><input type="number" id="ch" value="30"></div></div>
<div class="row"><div><label>Gap mm</label><input type="number" id="gap" value="2" step="0.5"></div><div><label>Paper margin mm</label><input type="number" id="mg" value="5"></div></div>
<p class="sub" style="margin:6px 0 0">Box size = label size. Paper 75×50 with box 75×50 gives 1 per paper. Paper 104.8×38 with box 50×38 gives 2 per paper.</p>
</div></details>

<details open><summary>2. Type or scan</summary><div class="body">
<label>Barcode value (type or scan)</label>
<input type="text" id="val" autocomplete="off" autofocus placeholder="Type or scan…">
<label>Title above barcode (optional)</label><input type="text" id="ttl" autocomplete="off">
<div class="row"><div><label>Copies</label><input type="number" id="cpy" value="1" min="1"></div>
<div><label>Barcode type</label><select id="fmt"><option value="AUTO">Auto</option><option>CODE128</option><option>EAN13</option><option>EAN8</option><option>UPC</option><option>CODE39</option><option>ITF14</option></select></div></div>
<label class="chk" style="margin:8px 0"><input type="checkbox" id="txt" checked> Show number below barcode</label>
<label>Number font size (pt) — text below barcode</label><input type="number" id="nf" value="10" step="0.5">
<label>Title font size (pt) — text above barcode</label><input type="number" id="fs" value="9" step="0.5">
<p class="sub" style="margin:10px 0 0">Press <b>Enter</b> (or scan) to print right away.</p>
</div></details>
</aside>
<main><div class="bar"><div class="info" id="count"></div><button id="printBtn">Print / PDF</button></div>
<div class="paper" id="paperEl"><div id="sheet"></div></div></main></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let q=[];
const fmtFor=v=>{const f=$("fmt").value;return f!=="AUTO"?f:/^\d{13}$/.test(v)?"EAN13":/^\d{12}$/.test(v)?"UPC":/^\d{8}$/.test(v)?"EAN8":"CODE128"};
const draft=()=>{const v=$("val").value.trim();return v?{v,t:$("ttl").value.trim(),n:Math.max(1,+$("cpy").value||1)}:null};
function commit(){if(!draft())return;render();window.print()}
window.addEventListener("afterprint",()=>{$("val").focus();$("val").select()});
function gen(s,v){const auto=$("fmt").value==="AUTO";let f=fmtFor(v);
 const o=()=>({format:f,displayValue:false,height:60,width:2,margin:0,marginLeft:10,marginRight:10});
 try{JsBarcode(s,v,o())}catch(e){if(auto&&f!=="CODE128"){f="CODE128";try{JsBarcode(s,v,o())}catch(e2){return{err:1,f}}}else return{err:1,f}}
 return{h:s.innerHTML,a:[...s.attributes].filter(a=>!/^(class|data-v|style)$/.test(a.name)).map(a=>[a.name,a.value])}}
function render(){
 const [PW,PH]=$("paper").value==="custom"?[+$("pw").value,+$("ph").value]:$("paper").value.split(",").map(Number);
 $("cust").hidden=$("paper").value!=="custom";
 const per=$("mode").value==="page",AU=$("auto").checked,mg=per&&AU?0:+$("mg").value,gap=+$("gap").value,fs=+$("fs").value,nf=+$("nf").value||10;
 const fit=(P,l,g)=>{let c=Math.max(1,Math.floor((P+.5)/l));while(c>1&&c*l+(c-1)*g>P+.5)c--;return c};
 const W=per?Math.min(+$("cw").value,PW-2*mg):+$("cw").value,H=per?Math.min(+$("ch").value,PH-2*mg):+$("ch").value;
 const cN=per?fit(PW-2*mg,W,gap):1,rN=per?fit(PH-2*mg,H,gap):1,nPer=cN*rN;
 const gx=cN>1?Math.max(0,Math.min(gap,(PW-2*mg-cN*W)/(cN-1))):0,gy=rN>1?Math.max(0,Math.min(gap,(PH-2*mg-rN*H)/(rN-1))):0;
 $("mg").disabled=per&&AU;
 const items=[];q.forEach(x=>{for(let i=0;i<x.n;i++)items.push(x)});const d=draft();if(d)for(let i=0;i<d.n;i++)items.push(d);
 $("pageStyle").textContent=per?`@page{size:${PW}mm ${PH}mm;margin:0}`:`@page{size:${PW}mm ${PH}mm;margin:${mg}mm}`;
 const P=$("paperEl"),S=$("sheet");
 $("count").textContent=items.length?`${items.length} barcode(s)`+(d?" · live preview of what you are typing":""):"Nothing to print yet";
 if(!items.length){P.style.cssText="background:none;box-shadow:none;padding:0;width:auto";S.style.cssText="";S.innerHTML='<div class="empty">Type or scan a barcode value and it will appear here instantly. Then press Print.</div>';return}
 const cell=x=>`<div class="cell" style="width:${W}mm;height:${H}mm">${x.t?`<div class="t" style="font-size:${fs}pt">${esc(x.t)}</div>`:""}<svg class="bc" data-v="${esc(x.v)}"></svg>${$("txt").checked?`<div class="num" style="font-size:${nf}pt">${esc(x.v)}</div>`:""}</div>`;
 if(per){P.style.cssText="background:none;box-shadow:none;padding:0;width:fit-content";S.style.cssText="display:block";
  S.innerHTML=items.map(x=>`<div class="pg" style="width:${PW}mm;height:${PH-0.4}mm;padding:${mg}mm;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:${gy}mm ${gx}mm">${Array(nPer).fill(cell(x)).join("")}</div>`).join("")}
 else{P.style.cssText=`padding:${mg}mm;width:${PW}mm;min-height:${PH}mm`;S.style.cssText=`display:flex;flex-wrap:wrap;gap:${gap}mm;align-content:flex-start;width:${PW-2*mg}mm`;S.innerHTML=items.map(cell).join("")}
 const cache=new Map();
 document.querySelectorAll("svg.bc").forEach(s=>{const v=s.dataset.v;let c=cache.get(v);
  if(!c){c=gen(s,v);cache.set(v,c)}else if(!c.err){c.a.forEach(([n,x])=>s.setAttribute(n,x));s.innerHTML=c.h}
  if(c.err)s.outerHTML=`<div class="err">Cannot make a ${c.f} barcode from "${esc(v)}"</div>`});
}
$("val").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();commit()}});
$("ttl").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();commit()}});
$("printBtn").onclick=()=>window.print();
["auto","paper","pw","ph","mode","cw","ch","gap","mg","val","ttl","cpy","fmt","txt","fs","nf"].forEach(id=>$(id).addEventListener("input",render));
render();
</script></body></html>

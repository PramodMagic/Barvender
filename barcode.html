<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real-time Barcode – Label Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#eef1ee;--panel:#fff;--ink:#14231c;--mute:#5d6b63;--line:#d5dcd6;--brand:#0f6b4f;--brand2:#e9f4ef}
*{box-sizing:border-box}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:4px;padding:0 16px;height:48px;background:#fff;border-bottom:1px solid var(--line)}
.top .logo{font:700 18px Georgia,serif;margin-right:auto;text-decoration:none;color:var(--ink)}
.top a.l{padding:6px 12px;border-radius:6px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px}
.top a.l:hover{background:var(--brand2)}.top a.on{background:var(--brand2);color:var(--brand)}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:360px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;overflow-y:auto;max-height:calc(100vh - 48px);position:sticky;top:48px}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mute);margin:0 0 12px;font-size:13px}
details{border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
summary{padding:9px 12px;font-weight:600;cursor:pointer;background:var(--brand2);border-radius:6px}
.body{padding:10px 12px}label{display:block;margin:6px 0 2px;font-size:12.5px;color:var(--mute)}
.chk{display:flex;align-items:center;gap:7px;color:var(--ink);cursor:pointer}
input[type=text],input[type=number],select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:5px;font:inherit;background:#fff}
#val{font-size:18px;padding:10px;border:2px solid var(--brand)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;padding:8px 12px;border-radius:6px;border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer;font-weight:600}
button.alt{background:#fff;color:var(--brand)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #e08a00;outline-offset:1px}
.rrow{display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
.rrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp{width:62px!important;padding:3px 4px!important}.rrow button{padding:2px 8px}
.q{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:5px;padding:2px 8px;margin-top:8px}
main{padding:18px;overflow:auto}.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px}.bar .info{flex:1;color:var(--mute)}
.paper{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18);margin:0 auto;width:fit-content}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:1mm;flex:none;font-family:Arial,sans-serif;color:#000;outline:1px dashed #bbb}
.num{font-weight:700;text-align:center;line-height:1.1;margin-top:.3mm;word-break:break-all}
.t{font-weight:700;text-align:center;line-height:1.15;margin-bottom:.5mm}
svg.bc{width:100%;flex:1;min-height:0}
.pg{break-after:page;page-break-after:always;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18);margin:0 auto 12px;overflow:hidden}
.pg:last-child{break-after:auto;page-break-after:auto}
.bcw{width:100%}.pdfmode .lbl,.pdfmode .cell{outline:none!important}.pdfmode .pg{box-shadow:none!important;margin:0!important}
#pimgs{display:none}@media print{.pimode .app,.pimode .top{display:none!important}.pimode #pimgs{display:block}#pimgs img{display:block;break-after:page;page-break-after:always}#pimgs img:last-child{break-after:auto;page-break-after:auto}}.lbl{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.err{font:12px Arial;color:#b00;padding:4px;text-align:center}
.empty{padding:60px 20px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:10px;background:#fff}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;max-height:none}}
@media print{.top{display:none}html,body{height:auto}.app{min-height:0}main{overflow:visible}body{background:#fff}.app{display:block}aside,.bar,.empty{display:none}main{padding:0}
.paper{box-shadow:none;margin:0;width:auto!important;padding:0!important}.cell{outline:none}.pg{box-shadow:none;margin:0}}
</style><style id="pageStyle"></style></head><body>
<div id="pimgs"></div>
<nav class="top"><a class="logo" href="/">Label Studio</a><a class="l" href="/">Home</a><a class="l" href="/app">Excel labels</a><a class="l on" href="/barcode">Real-time barcode</a></nav>
<div class="app"><aside>
<h1>Real-time Barcode</h1><p class="sub">Pick a paper, type or scan, and print.</p>

<details open><summary>1. Paper</summary><div class="body">
<label>Paper size</label>
<select id="paper"><option value="210,297">A4</option><option value="148,210">A5</option><option value="216,279">Letter</option><option value="101.6,152.4">4 × 6 in</option><option value="custom">Custom / roll</option></select>
<div class="row" id="cust" hidden><div><label>Width mm</label><input type="number" id="pw" value="104.8" step="0.1"></div><div><label>Height mm</label><input type="number" id="ph" value="38" step="0.1"></div></div>
<label>Layout</label>
<select id="mode"><option value="page">Per paper (roll / thermal): fills each paper with barcode boxes</option></select>
<label class="chk" style="margin:8px 0 2px"><input type="checkbox" id="auto" checked> Auto layout: margin and boxes per paper are set automatically</label>
<div class="row"><div><label>Barcode box width mm</label><input type="number" id="cw" value="50"></div><div><label>Barcode box height mm</label><input type="number" id="ch" value="30"></div></div>
<div class="row"><div><label>Barcode width % of box</label><input type="number" id="bw" value="100" min="20" max="100"></div><div><label>Barcode height mm (0 = auto)</label><input type="number" id="bh" value="0" min="0" step="0.5"></div></div>
<div class="row"><div><label>Gap mm</label><input type="number" id="gap" value="2" step="0.5"></div><div><label>Paper margin mm</label><input type="number" id="mg" value="5"></div></div>
<div class="row"><div><label>Shift X mm (alignment)</label><input type="number" id="sx" value="0" step="0.1"></div><div><label>Shift Y mm</label><input type="number" id="sy" value="0" step="0.1"></div></div>
<div class="row"><div><label>Inner padding mm</label><input type="number" id="ip" value="1" step="0.5"></div><div></div></div>
<button class="alt" id="calBtn" style="margin:6px 0;width:100%">Print calibration test label</button>
<p class="sub" style="margin:6px 0 0">Box size = label size. Paper 75×50 with box 75×50 gives 1 per paper. Paper 104.8×38 with box 50×38 gives 2 per paper.</p>
</div></details>

<details open><summary>2. Type or scan</summary><div class="body">
<label>Barcode value (type or scan)</label>
<input type="text" id="val" autocomplete="off" autofocus placeholder="Type or scan…">
<label>Title above barcode (optional)</label><input type="text" id="ttl" autocomplete="off">
<div class="row"><div><label>Copies</label><input type="number" id="cpy" value="1" min="1"></div>
<div><label>Barcode type</label><select id="fmt"><option value="AUTO">Auto</option><option>CODE128</option><option>EAN13</option><option>EAN8</option><option>UPC</option><option>CODE39</option><option>ITF14</option></select></div></div>
<label class="chk" style="margin:8px 0"><input type="checkbox" id="txt" checked> Show number below barcode</label>
<label>Font family (type any installed font)</label><input type="text" id="ff" list="fonts" value="Arial"><datalist id="fonts"><option value="Arial"><option value="Arial Narrow"><option value="Aptos Narrow"><option value="Aptos"><option value="Calibri"><option value="Cambria"><option value="Candara"><option value="Consolas"><option value="Courier New"><option value="Georgia"><option value="Impact"><option value="Segoe UI"><option value="Tahoma"><option value="Times New Roman"><option value="Trebuchet MS"><option value="Verdana"><option value="Roboto"><option value="Open Sans"></datalist>
<label>Number font size (pt) — text below barcode</label><input type="number" id="nf" value="10" step="0.5"><div style="display:flex;gap:10px;align-items:center;margin-top:5px;flex-wrap:wrap"><label class="chk" title="Bold"><input type="checkbox" id="nb" checked><b>B</b></label><label class="chk" title="Italic"><input type="checkbox" id="ni"><i>I</i></label><label class="chk" title="Underline"><input type="checkbox" id="nu"><u>U</u></label><label class="chk" title="Text color">A<input type="color" id="nc" value="#000000" style="width:34px;height:26px;padding:0"></label><label class="chk" title="Highlight"><input type="checkbox" id="nhon">Fill<input type="color" id="nh" value="#ffff00" style="width:34px;height:26px;padding:0"></label></div>
<label>Title font size (pt) — text above barcode</label><input type="number" id="fs" value="9" step="0.5"><div style="display:flex;gap:10px;align-items:center;margin-top:5px;flex-wrap:wrap"><label class="chk" title="Bold"><input type="checkbox" id="tb" checked><b>B</b></label><label class="chk" title="Italic"><input type="checkbox" id="ti"><i>I</i></label><label class="chk" title="Underline"><input type="checkbox" id="tu"><u>U</u></label><label class="chk" title="Text color">A<input type="color" id="tc" value="#000000" style="width:34px;height:26px;padding:0"></label><label class="chk" title="Highlight"><input type="checkbox" id="thon">Fill<input type="color" id="th" value="#ffff00" style="width:34px;height:26px;padding:0"></label></div>
<p class="sub" style="margin:10px 0 0">Press <b>Enter</b> (or scan) to print right away.</p>
</div></details>
</aside>
<main><div class="bar"><div class="info" id="count"></div><button id="printBtn">Print</button> <button class="alt" id="pdfBtn">Download PDF (exact size)</button> <span id="pfb" style="font-size:12.5px"></span></div>
<div class="paper" id="paperEl"><div id="sheet"></div></div></main></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let q=[];
const fmtFor=v=>{const f=$("fmt").value;return f!=="AUTO"?f:/^\d{13}$/.test(v)?"EAN13":/^\d{12}$/.test(v)?"UPC":/^\d{8}$/.test(v)?"EAN8":"CODE128"};
const draft=()=>{const v=$("val").value.trim();return v?{v,t:$("ttl").value.trim(),n:Math.max(1,+$("cpy").value||1)}:null};
function commit(){if(!draft())return;printNow()}
window.addEventListener("afterprint",()=>{$("val").focus();$("val").select()});
function gen(s,v){const st0=s.getAttribute("style"),auto=$("fmt").value==="AUTO";let f=fmtFor(v);
 const o=()=>({format:f,displayValue:false,height:60,width:2,margin:0,marginLeft:10,marginRight:10});
 try{JsBarcode(s,v,o())}catch(e){if(auto&&f!=="CODE128"){f="CODE128";try{JsBarcode(s,v,o())}catch(e2){return{err:1,f}}}else return{err:1,f}}
 if(st0)s.setAttribute("style",st0);
 return{h:s.innerHTML,a:[...s.attributes].filter(a=>!/^(class|data-v|style)$/.test(a.name)).map(a=>[a.name,a.value])}}
let calib=false;
function CAL(w,h,sh){let t="";for(let y=5;y<h;y+=5)t+=`<div style="position:absolute;left:0;top:${y}mm;width:3mm;border-top:.2mm solid #000"></div><div style="position:absolute;left:4mm;top:${y-1.3}mm;font:6pt Arial">${y}</div>`;
 return `<div style="width:${w}mm;height:${h}mm;flex:none;position:relative;box-sizing:border-box;border:.3mm solid #000${sh}"><div style="position:absolute;top:.5mm;left:50%;font:7pt Arial;transform:translateX(-50%)">TOP edge</div><div style="position:absolute;bottom:.5mm;left:50%;font:7pt Arial;transform:translateX(-50%)">BOTTOM edge</div>${t}</div>`}
function render(){
 const [PW,PH]=$("paper").value==="custom"?[+$("pw").value,+$("ph").value]:$("paper").value.split(",").map(Number);
 $("cust").hidden=$("paper").value!=="custom";
 const per=true,AU=$("auto").checked,mg=per&&AU?0:+$("mg").value,gap=+$("gap").value,fs=+$("fs").value,nf=+$("nf").value||10;
 const bw=+$("bw").value||100,bh=+$("bh").value||0;
 const sh=(+$("sx").value||+$("sy").value)?`;transform:translate(${+$("sx").value||0}mm,${+$("sy").value||0}mm)`:"",ip=$("ip").value===""?1:+$("ip").value;
 const sty=p=>`font-weight:${$(p+"b").checked?700:400};font-style:${$(p+"i").checked?"italic":"normal"};text-decoration:${$(p+"u").checked?"underline":"none"};color:${$(p+"c").value}`,hl=p=>$(p+"hon").checked?` style="background:${$(p+"h").value}"`:"";
 const fit=(P,l,g)=>{let c=Math.max(1,Math.floor((P+.5)/l));while(c>1&&c*l+(c-1)*g>P+.5)c--;return c};
 const W=per?Math.min(+$("cw").value,PW-2*mg):+$("cw").value,H=per?Math.min(+$("ch").value,PH-2*mg):+$("ch").value;
 const cN=per?fit(PW-2*mg,W,gap):1,rN=per?fit(PH-2*mg,H,gap):1,nPer=cN*rN;
 const gx=cN>1?Math.max(0,Math.min(gap,(PW-2*mg-cN*W)/(cN-1))):0,gy=rN>1?Math.max(0,Math.min(gap,(PH-2*mg-rN*H)/(rN-1))):0;
 $("mg").disabled=per&&AU;
 const items=[];q.forEach(x=>{for(let i=0;i<x.n;i++)items.push(x)});const d=draft();if(d)for(let i=0;i<d.n;i++)items.push(d);
 if(calib)items.splice(0,items.length,{cal:1});
 $("pageStyle").textContent=per?`@page{size:${PW}mm ${PH}mm;margin:0}`:`@page{size:${PW}mm ${PH}mm;margin:${mg}mm}`;
 const P=$("paperEl"),S=$("sheet");
 $("count").textContent=items.length?`${items.length} barcode(s)`+(d?" · live preview of what you are typing":""):"Nothing to print yet";
 if(!items.length){P.style.cssText="background:none;box-shadow:none;padding:0;width:auto";S.style.cssText="";S.innerHTML='<div class="empty">Type or scan a barcode value and it will appear here instantly. Then press Print.</div>';return}
 const bhOf=x=>bh?Math.min(bh,H*.85):Math.max(3,H-2*ip-(x.t?fs*.353*1.25+.5:0)-($("txt").checked?nf*.353*1.2+.6:0)-.5);
 const cell=x=>x.cal?CAL(W,H,sh):`<div class="cell" style="width:${W}mm;height:${H}mm;padding:${ip}mm${sh};font-family:'${($("ff").value||"Arial").replace(/['";<>]/g,"")}',Arial,sans-serif">${x.t?`<div class="t" style="font-size:${fs}pt;${sty("t")}"><span${hl("t")}>${esc(x.t)}</span></div>`:""}<svg class="bc" data-v="${esc(x.v)}" preserveAspectRatio="none" style="width:${bw}%;height:${bhOf(x)}mm;flex:none"></svg>${$("txt").checked?`<div class="num" style="font-size:${nf}pt;${sty("n")}"><span${hl("n")}>${esc(x.v)}</span></div>`:""}</div>`;
 if(per){P.style.cssText="background:none;box-shadow:none;padding:0;width:fit-content";S.style.cssText="display:block";
  S.innerHTML=items.map(x=>`<div class="pg" style="width:${PW}mm;height:${PH-0.4}mm;padding:${mg}mm;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:${gy}mm ${gx}mm">${Array(nPer).fill(cell(x)).join("")}</div>`).join("")}
 else{P.style.cssText=`padding:${mg}mm;width:${PW}mm;min-height:${PH}mm`;S.style.cssText=`display:flex;flex-wrap:wrap;gap:${gap}mm;align-content:flex-start;width:${PW-2*mg}mm`;S.innerHTML=items.map(cell).join("")}
 const cache=new Map();
 document.querySelectorAll("svg.bc").forEach(s=>{const v=s.dataset.v;let c=cache.get(v);
  if(!c){c=gen(s,v);cache.set(v,c)}else if(!c.err){c.a.forEach(([n,x])=>s.setAttribute(n,x));s.innerHTML=c.h}
  if(!c.err&&!s.getAttribute("viewBox"))s.setAttribute("viewBox",`0 0 ${s.getAttribute("width")||200} ${s.getAttribute("height")||60}`);
  if(c.err)s.outerHTML=`<div class="err">Cannot make a ${c.f} barcode from "${esc(v)}"</div>`});
}
function drawPage(pg,S){
 const R=pg.getBoundingClientRect(),cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(R.width*S));cv.height=Math.max(1,Math.round(R.height*S));
 const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.scale(S,S);
 const ox=R.left,oy=R.top,CL=v=>v==="rgba(0, 0, 0, 0)"||v==="transparent";
 const bar=r=>{const l=Math.round((r.left-ox)*S)/S,q=Math.round((r.right-ox)*S)/S,t=Math.round((r.top-oy)*S)/S,b=Math.round((r.bottom-oy)*S)/S;x.fillRect(l,t,Math.max(1/S,q-l),Math.max(1/S,b-t))};
 const text=(n,cs,ul)=>{
  const s=n.nodeValue;if(!s.trim())return;const fs=parseFloat(cs.fontSize);
  x.font=`${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;x.fillStyle=cs.color;
  const asc=x.measureText("Hg").fontBoundingBoxAscent||fs*.8,rg=document.createRange(),re=/\S+/g,lines=[];let m,cur=null;
  const add=(str,q,sp)=>{if(!q||(!q.width&&!q.height))return;if(cur&&Math.abs(q.top-cur.top)<fs*.4){cur.s+=(sp?" ":"")+str;cur.right=q.right}else{cur={s:str,left:q.left,right:q.right,top:q.top,bot:q.bottom};lines.push(cur)}};
  while((m=re.exec(s))){rg.setStart(n,m.index);rg.setEnd(n,m.index+m[0].length);const rs=rg.getClientRects();
   if(rs.length<=1)add(m[0],rs[0]||rg.getBoundingClientRect(),true);
   else for(let k=0;k<m[0].length;k++){rg.setStart(n,m.index+k);rg.setEnd(n,m.index+k+1);add(m[0][k],rg.getBoundingClientRect(),k===0)}}
  const bgc=cs.backgroundColor,hl=cs.display==="inline"&&!CL(bgc);
  for(const L of lines){if(hl){x.fillStyle=bgc;x.fillRect(L.left-ox,L.top-oy,L.right-L.left,L.bot-L.top);x.fillStyle=cs.color}
   const by=L.top-oy+asc;x.fillText(L.s,L.left-ox,by);if(ul)x.fillRect(L.left-ox,by+fs*.1,x.measureText(L.s).width,Math.max(.6,fs/16))}
 };
 const walk=(el,ul)=>{
  const cs=getComputedStyle(el);if(cs.display==="none"||cs.visibility==="hidden")return;
  if(el.tagName.toLowerCase()==="svg"){
   if(el.classList.contains("bcode")||el.classList.contains("bc")){
    const vb=(el.getAttribute("viewBox")||"").trim().split(/[\s,]+/).map(Number),sr=el.getBoundingClientRect();
    if(vb.length===4&&vb[2]>0&&vb[3]>0){const sx=sr.width/vb[2],sy=sr.height/vb[3];x.fillStyle="#000";
     el.querySelectorAll("rect").forEach(q=>{const ws=q.getAttribute("width")||"",w=parseFloat(ws),h=parseFloat(q.getAttribute("height"));
      if(!(w>0&&h>0)||ws.includes("%"))return;
      const g=q.parentNode,m=/translate\(\s*([-\d.]+)[\s,]+([-\d.]+)\s*\)/.exec((g.getAttribute&&g.getAttribute("transform"))||""),tx=m?+m[1]:0,ty=m?+m[2]:0;
      const l=sr.left+(tx+(+q.getAttribute("x")||0)-vb[0])*sx,t=sr.top+(ty+(+q.getAttribute("y")||0)-vb[1])*sy;
      bar({left:l,right:l+w*sx,top:t,bottom:t+h*sy})})}
   }return}
  const r=el.getBoundingClientRect(),inl=cs.display==="inline";x.save();
  if(!inl&&(cs.overflowX!=="visible"||cs.overflowY!=="visible"||(cs.webkitLineClamp&&cs.webkitLineClamp!=="none"))){x.beginPath();x.rect(r.left-ox,r.top-oy,r.width,r.height);x.clip()}
  if(!inl){
   if(!CL(cs.backgroundColor)){x.fillStyle=cs.backgroundColor;x.fillRect(r.left-ox,r.top-oy,r.width,r.height)}
   const bd=(w,st,c,l,t,ww,hh)=>{w=parseFloat(w)||0;if(w>0&&st!=="none"&&!CL(c)){x.fillStyle=c;x.fillRect(l-ox,t-oy,ww(w),hh(w))}};
   bd(cs.borderTopWidth,cs.borderTopStyle,cs.borderTopColor,r.left,r.top,()=>r.width,w=>w);
   bd(cs.borderBottomWidth,cs.borderBottomStyle,cs.borderBottomColor,r.left,r.bottom-(parseFloat(cs.borderBottomWidth)||0),()=>r.width,w=>w);
   bd(cs.borderLeftWidth,cs.borderLeftStyle,cs.borderLeftColor,r.left,r.top,w=>w,()=>r.height);
   bd(cs.borderRightWidth,cs.borderRightStyle,cs.borderRightColor,r.right-(parseFloat(cs.borderRightWidth)||0),r.top,w=>w,()=>r.height);
  }
  const u=ul||cs.textDecorationLine.includes("underline");
  for(const n of el.childNodes){if(n.nodeType===3)text(n,cs,u);else if(n.nodeType===1)walk(n,u)}
  x.restore();
 };
 walk(pg,false);return cv;
}
async function snap(btn,label){
 const [PW,PH]=$("paper").value==="custom"?[+$("pw").value,+$("ph").value]:$("paper").value.split(",").map(Number);
 render(true);await new Promise(r=>setTimeout(r,30));
 const pages=[...document.querySelectorAll("#sheet .pg")];if(!pages.length)throw new Error("Nothing to export yet");
 const cache=new Map(),list=[];
 for(let i=0;i<pages.length;i++){
  if(i%6===0){btn.textContent=`${label} ${i+1}/${pages.length}`;await new Promise(r=>setTimeout(r))}
  const k=pages[i].innerHTML;let r=cache.get(k);
  if(!r){const c=drawPage(pages[i],300/96);r={id:"p"+cache.size,url:c.toDataURL("image/png"),h:PW*c.height/c.width};cache.set(k,r)}
  list.push(r)}
 return{PW,PH,list};
}
async function toPDF(){const b=$("pdfBtn"),t=b.textContent;b.disabled=true;
 try{const{PW,PH,list}=await snap(b,"PDF");const o=PW>PH?"l":"p",doc=new window.jspdf.jsPDF({compress:true,unit:"mm",format:[PW,PH],orientation:o});
  list.forEach((r,i)=>{if(i)doc.addPage([PW,PH],o);doc.addImage(r.url,"PNG",0,0,PW,r.h,r.id,"FAST")});doc.save("labels.pdf")}catch(e){alert("PDF error: "+e.message)}
 render();b.disabled=false;b.textContent=t}
async function printNow(){
 const b=$("printBtn"),t=b.textContent;b.disabled=true;
 try{
  const{PW,PH,list}=await snap(b,"Preparing");calib=false;
  const o=PW>PH?"l":"p",doc=new window.jspdf.jsPDF({compress:true,unit:"mm",format:[PW,PH],orientation:o});
  list.forEach((r,i)=>{if(i)doc.addPage([PW,PH],o);doc.addImage(r.url,"PNG",0,0,PW,r.h,r.id,"FAST")});
  const url=URL.createObjectURL(doc.output("blob"));
  const old=document.getElementById("pfrm");if(old)old.remove();
  const f=document.createElement("iframe");f.id="pfrm";f.style.cssText="position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0";
  f.onload=()=>setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){window.open(url,"_blank")}},400);
  f.src=url;document.body.appendChild(f);
  $("pfb").innerHTML=`<a href="${url}" target="_blank" style="color:var(--brand)">Print window not opening? Open the PDF</a>`;
 }catch(e){alert("Print error: "+e.message)}
 render();b.disabled=false;b.textContent=t;
 const v=document.getElementById("val");if(v){v.focus();v.select()}}
window.addEventListener("afterprint",()=>{document.body.classList.remove("pimode");$("pimgs").innerHTML="";if(calib){calib=false;render()}});
$("calBtn").onclick=()=>{calib=true;printNow()};
$("pdfBtn").onclick=toPDF;$("printBtn").onclick=printNow;
$("val").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();commit()}});
$("ttl").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();commit()}});

["ff","auto","paper","pw","ph","mode","cw","ch","gap","mg","val","ttl","cpy","fmt","txt","sx","sy","ip","bw","bh","fs","nf","nb","ni","nu","nc","nhon","nh","tb","ti","tu","tc","thon","th"].forEach(id=>$(id).addEventListener("input",render));
render();
</script></body></html>
